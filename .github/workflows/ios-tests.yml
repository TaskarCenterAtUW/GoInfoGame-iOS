# Pipeline: checkout -> build once -> run unit tests -> run UI tests on every
# device in UI_SIMULATORS (one per line; any device not installed on the runner
# is recorded as "not installed", not silently dropped) -> extract a screenshot
# for each failing UI test -> render one combined report (HTML + best-effort PDF,
# plus Markdown) with a results summary and, per failure, the assertion detail and
# screenshot -> bundle test-report.{md,html,pdf} into one tar.gz and upload it as
# a GitHub Actions artifact (retried via Wandalen/wretry.action - see that step).
#
# NOTE: this runner has intermittently been unable to reach the Actions artifact
# backend regardless of payload size (1256 files, 26 files, 1 archive all hit the
# same CreateArtifact/FinalizeArtifact timeout on some runs) - a known class of
# issue on some self-hosted runners (actions/upload-artifact#531, #623). The
# upload is continue-on-error so a repeat timeout does not fail the job; the
# Markdown is also always written to the run summary as a fallback view.
# JUnit XML, per-device xcodebuild logs and .xcresult bundles stay under ./build.
#
# Runs on a SELF-HOSTED runner (label: self-hosted) that already has Xcode,
# xcbeautify, CocoaPods and the iOS simulators installed.
#
# Knobs - env: block below:
#   UNIT_SIMULATOR    - one device to run the unit tests on
#   UI_SIMULATORS     - newline-separated device list for the UI tests
#   UI_MAX_PARALLEL   - how many simulators to run UI tests on at the same time
#                       (1 = serial. 2-4 is sane on one Mac; more will thrash RAM.)
#
# Optional repo secrets (Settings > Secrets and variables > Actions):
#   KARTAVIEW_ACCESS_TOKEN, JAWG_ACCESS_TOKEN  -> written to Secrets.xcconfig if it
#   is missing on the runner; the build tolerates their absence (#include?).

name: iOS Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write          # mikepenz/action-junit-report posts a check run
  pull-requests: write   # ...and annotates the PR

env:
  WORKSPACE: GoInfoGame/GoInfoGame.xcworkspace
  SCHEME: GoInfoGame
  UNIT_SIMULATOR: "iPhone 16 Pro"
  UI_MAX_PARALLEL: "2"
  # One device name per line. Unknown names are skipped (warning), so this list
  # can be aspirational. Add every simulator you care about here.
  UI_SIMULATORS: |
    iPhone SE (3rd generation)
    iPhone 16
    iPhone 16 Plus
    iPhone 16 Pro
    iPhone 16 Pro Max
    iPad (10th generation)
    iPad mini (6th generation)
    iPad Air 11-inch (M2)
    iPad Air 13-inch (M2)
    iPad Pro 11-inch (M4)
    iPad Pro 13-inch (M4)

jobs:
  test:
    name: Unit + UI tests
    runs-on: self-hosted
    timeout-minutes: 150

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Tooling versions
        run: |
          set -euo pipefail
          xcodebuild -version
          pod --version
          command -v xcbeautify >/dev/null || { echo "::error::xcbeautify not on PATH (brew install xcbeautify)"; exit 1; }
          xcbeautify --version

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: GoInfoGame/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('GoInfoGame/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/GoInfoGame-*/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('GoInfoGame/GoInfoGame.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Write Secrets.xcconfig (only if missing)
        env:
          KARTAVIEW_ACCESS_TOKEN: ${{ secrets.KARTAVIEW_ACCESS_TOKEN }}
          JAWG_ACCESS_TOKEN: ${{ secrets.JAWG_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          dest="GoInfoGame/GoInfoGame/Resources/Secrets.xcconfig"
          if [ -f "$dest" ]; then
            echo "$dest already present - leaving it untouched."
          elif [ -n "${KARTAVIEW_ACCESS_TOKEN:-}" ] || [ -n "${JAWG_ACCESS_TOKEN:-}" ]; then
            printf 'KARTAVIEW_ACCESS_TOKEN = %s\nJAWG_ACCESS_TOKEN = %s\n' \
              "${KARTAVIEW_ACCESS_TOKEN:-}" "${JAWG_ACCESS_TOKEN:-}" > "$dest"
            echo "Wrote $dest from repository secrets."
          else
            echo "No $dest and no token secrets - Config.xcconfig #include? tolerates this."
          fi

      - name: pod install
        working-directory: GoInfoGame
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: pod install

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -workspace "$WORKSPACE" -scheme "$SCHEME"

      # -------- build once, then reuse for every test run --------
      - name: Build for testing
        run: |
          set -o pipefail
          rm -rf build/reports build/results build/*.log
          mkdir -p build/reports build/results
          xcrun simctl shutdown all || true
          NSUnbufferedIO=YES xcodebuild build-for-testing \
            -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            -enableCodeCoverage YES \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/build.log \
            | xcbeautify

      # -------- STEP 1: unit tests --------
      - name: Unit tests
        run: |
          set +e                       # keep the step alive so cleanup/report always run
          set -o pipefail
          udid=$(xcrun simctl list devices available | grep -F "$UNIT_SIMULATOR (" | grep -oE '[0-9A-F-]{36}' | head -1)
          if [ -z "$udid" ]; then
            echo "::error::unit simulator '$UNIT_SIMULATOR' not installed"
            xcrun simctl list devices available | grep -i iphone
            exit 1
          fi
          xcrun simctl boot "$udid"; xcrun simctl bootstatus "$udid" -b
          mkdir -p build/reports/unit
          NSUnbufferedIO=YES xcodebuild test-without-building \
            -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$udid" \
            -only-testing:GoInfoGameTests \
            -resultBundlePath build/results/unit.xcresult \
            -enableCodeCoverage YES -retry-tests-on-failure -test-timeouts-enabled YES \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/unit.log \
            | xcbeautify --report junit --report-path build/reports/unit
          rc=${PIPESTATUS[0]}
          [ -f build/reports/unit/junit.xml ] && mv build/reports/unit/junit.xml build/reports/unit.xml
          rmdir build/reports/unit 2>/dev/null
          xcrun simctl shutdown "$udid"
          echo "unit tests exit code: $rc"
          exit "$rc"

      # -------- STEP 2: UI tests, run on UI_SIMULATORS, UI_MAX_PARALLEL at a time --------
      - name: UI tests (parallel across devices)
        if: always()      # still run UI tests even if a unit test failed
        run: |
          set +e            # a failing device must NOT abort the step
          max_par="${UI_MAX_PARALLEL:-2}"
          echo "Running UI tests, up to $max_par simulator(s) at once."

          # runs one device end-to-end; writes build/results/.rc-<slug> as "<rc>\t<device>"
          run_device() {
            _dev="$1"; _udid="$2"; _slug="$3"; _log="build/ui-$_slug.log"
            xcrun simctl boot "$_udid" >/dev/null 2>&1
            xcrun simctl bootstatus "$_udid" -b >/dev/null 2>&1
            NSUnbufferedIO=YES xcodebuild test-without-building \
              -workspace "$WORKSPACE" -scheme "$SCHEME" \
              -destination "platform=iOS Simulator,id=$_udid" \
              -only-testing:GoInfoGameUITests \
              -resultBundlePath "build/results/ui-$_slug.xcresult" \
              -retry-tests-on-failure -test-timeouts-enabled YES \
              CODE_SIGNING_ALLOWED=NO > "$_log" 2>&1
            _rc=$?
            mkdir -p "build/reports/ui-$_slug"
            xcbeautify --report junit --report-path "build/reports/ui-$_slug" < "$_log" >/dev/null 2>&1 || true
            [ -f "build/reports/ui-$_slug/junit.xml" ] && mv "build/reports/ui-$_slug/junit.xml" "build/reports/ui-$_slug.xml"
            rmdir "build/reports/ui-$_slug" 2>/dev/null
            xcrun simctl shutdown "$_udid" >/dev/null 2>&1
            printf '%s\t%s\n' "$_rc" "$_dev" > "build/results/.rc-$_slug"
            if [ "$_rc" -eq 0 ]; then echo "[done] $_dev — passed"; else echo "[done] $_dev — FAILED (exit $_rc), see build/ui-$_slug.log"; fi
          }

          : > build/results/skipped.txt      # devices requested but not installed
          pids=""; running=0
          while IFS= read -r device; do
            device="$(printf '%s' "$device" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
            [ -z "$device" ] && continue
            case "$device" in \#*) continue ;; esac   # allow '# ...' comment lines in UI_SIMULATORS
            udid=$(xcrun simctl list devices available | grep -F "$device (" | grep -oE '[0-9A-F-]{36}' | head -1)
            if [ -z "$udid" ]; then
              echo "::warning::simulator '$device' not installed on this runner - recorded as skipped"
              printf '%s\n' "$device" >> build/results/skipped.txt
              continue
            fi
            slug=$(echo "$device" | tr -cs '[:alnum:]' '-' | sed 's/^-*//; s/-*$//')
            echo "[start] $device ($udid)"
            run_device "$device" "$udid" "$slug" &
            pids="$pids $!"; running=$((running + 1))
            if [ "$running" -ge "$max_par" ]; then
              set -- $pids; wait "$1"; shift; pids="$*"; running=$((running - 1))
            fi
          done <<< "$UI_SIMULATORS"
          wait   # let the last batch finish

          # tally results from the .rc-* files
          ran=0; failed=""
          for f in build/results/.rc-*; do
            [ -e "$f" ] || continue
            ran=$((ran + 1))
            rc=$(cut -f1 < "$f"); dev=$(cut -f2- < "$f")
            if [ "$rc" != "0" ]; then
              failed="${failed}"$'\n'"  - ${dev} (exit $rc)"
              slug=$(echo "$dev" | tr -cs '[:alnum:]' '-' | sed 's/^-*//; s/-*$//')
              echo "::group::FAILED: $dev — tail of build/ui-$slug.log"
              tail -n 60 "build/ui-$slug.log" 2>/dev/null || true
              echo "::endgroup::"
            fi
          done
          skipped=$(grep -c . build/results/skipped.txt 2>/dev/null || echo 0)
          echo "Ran UI tests on $ran device(s); $skipped requested device(s) not installed."
          [ "$ran" -eq 0 ] && { echo "::error::no UI simulators from the list are installed - nothing ran"; exit 1; }
          [ -n "$failed" ] && { printf '::error::UI tests failed on:%s\n' "$failed"; exit 1; }
          echo "All UI device runs passed."

      # -------- reporting --------
      - name: Publish test report (checks / PR annotations)
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: build/reports/*.xml
          check_name: iOS test results
          include_passed: true
          require_tests: true

      - name: Extract failure screenshots
        if: always()
        continue-on-error: true
        run: |
          mkdir -p build/report/screenshots
          had_fail=0
          ensure_xcparse() { command -v xcparse >/dev/null || brew install --quiet chargepoint/xcparse/xcparse; }

          # UI: only pull screenshots from device runs that FAILED
          for f in build/results/.rc-*; do
            [ -e "$f" ] || continue
            rc=$(cut -f1 < "$f"); [ "$rc" = "0" ] && continue
            slug=$(basename "$f" | sed 's/^\.rc-//')
            x="build/results/ui-$slug.xcresult"
            [ -d "$x" ] || continue
            ensure_xcparse
            xcparse screenshots --test "$x" "build/report/screenshots/ui-$slug" >/dev/null 2>&1 || true
            had_fail=1
          done

          # unit: only if it produced failures
          if [ -d build/results/unit.xcresult ] && grep -q '<failure' build/reports/unit.xml 2>/dev/null; then
            ensure_xcparse
            xcparse screenshots --test build/results/unit.xcresult build/report/screenshots/unit >/dev/null 2>&1 || true
            had_fail=1
          fi

          [ "$had_fail" = 0 ] && echo "no failing runs - no screenshots to extract"
          find build/report/screenshots -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' \) -print 2>/dev/null || true

      - name: Ensure a PDF engine (weasyprint)
        if: always()
        continue-on-error: true
        run: command -v weasyprint >/dev/null || brew install --quiet weasyprint

      - name: Generate combined report (MD / HTML / PDF)
        if: always()
        continue-on-error: true
        env:
          GIT_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 scripts/ci/test_report.py \
            --junit build/reports/unit.xml build/reports/ui-*.xml \
            --xcresult build/results/unit.xcresult \
            --screenshots-dir build/report/screenshots \
            --skipped-file build/results/skipped.txt \
            --out-dir build/report

      # Bundle the report into one file. HTML/PDF embed the failure screenshots inline
      # (base64), so this archive is fully self-contained - no separate screenshots
      # folder needed.
      # tar.gz, not zip - actions/upload-artifact always wraps whatever it uploads in
      # its own container zip on download, so a raw .zip here would become a
      # same-named "test-report.zip" nested inside GitHub's own wrapper zip -
      # indistinguishable from a corrupt file to anyone extracting it without
      # realizing there's a second layer. tar.gz doesn't collide with that outer zip.
      - name: Bundle report
        if: always()
        continue-on-error: true
        run: |
          ws="$PWD"
          present=()
          for f in test-report.md test-report.html test-report.pdf; do
            [ -f "build/report/$f" ] && present+=("$f")
          done
          if [ "${#present[@]}" -eq 0 ]; then
            echo "::warning::no report files found under build/report - nothing to bundle"
          else
            rm -f build/test-report.tar.gz
            ( cd build/report && tar -czf "$ws/build/test-report.tar.gz" "${present[@]}" )
            echo "bundled: ${present[*]}"
          fi

      # Wrapped in a retry (whole action, not just the request) - the Actions
      # artifact backend has intermittently timed out on CreateArtifact/
      # FinalizeArtifact from self-hosted runners regardless of payload size
      # (actions/upload-artifact#531, #623; no fix from GitHub yet), and upload-
      # artifact's own internal backoff (~30s across 5 tries) hasn't been enough
      # here. continue-on-error so exhausting retries doesn't fail the job -
      # pass/fail is already reported independently via the JUnit check above.
      - name: Upload report artifact (tar.gz)
        uses: Wandalen/wretry.action@v3.8.0
        if: always()
        continue-on-error: true
        with:
          action: actions/upload-artifact@v4
          attempt_limit: 3
          attempt_delay: 15000
          with: |
            name: test-report
            path: build/test-report.tar.gz
            retention-days: 14
            if-no-files-found: warn

      - name: Clean up simulators
        if: always()
        run: xcrun simctl shutdown all || true
