name: Runner smoke test

on:
  workflow_dispatch:
  push:
    branches: [define-testing-workflow]

jobs:
  ping:
    runs-on: self-hosted
    steps:
      - name: Confirm this ran on the Mac mini
        run: |
          echo "Runner name: $RUNNER_NAME"
          echo "Runner OS:   $RUNNER_OS"
          hostname
          whoami
          xcodebuild -version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
