# Builds the app and runs the unit + UI test suite on every push / PR,
# then publishes a test report and code-coverage summary.
#
# Runs on a SELF-HOSTED runner (label: self-hosted) that already has Xcode,
# xcbeautify, CocoaPods and the iOS simulators installed.
#
# Knobs (env: block below):
#   SIMULATOR - Simulator device name that exists on the runner.
#
# Optional repository secrets (Settings > Secrets and variables > Actions):
#   KARTAVIEW_ACCESS_TOKEN, JAWG_ACCESS_TOKEN
#   Written to Secrets.xcconfig before the build *only if that file does not
#   already exist on the runner*. If neither the file nor the secrets are
#   present the build still succeeds (Config.xcconfig uses `#include?`), but
#   map / Kartaview code gets empty tokens.
#
# Reports produced (uploaded as the `test-results` artifact + posted to the run summary):
#   test-report.md / .html   - always
#   test-report.pdf          - only if the runner has an HTML->PDF converter on PATH
#                              (Google Chrome, pandoc, wkhtmltopdf, or weasyprint)
#   TestResults.xcresult, junit.xml, xcodebuild.log

name: iOS Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write          # mikepenz/action-junit-report posts a check run
  pull-requests: write   # ...and annotates the PR

env:
  SIMULATOR: "iPhone 16 Pro"
  WORKSPACE: GoInfoGame/GoInfoGame.xcworkspace
  SCHEME: GoInfoGame     # default test plan (GoInfoGame.xctestplan) = GoInfoGameTests + GoInfoGameUITests

jobs:
  test:
    name: Unit + UI tests
    runs-on: self-hosted
    timeout-minutes: 75

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Tooling versions
        run: |
          set -euo pipefail
          xcodebuild -version
          pod --version
          command -v xcbeautify >/dev/null || { echo "::error::xcbeautify not on PATH - install it on the runner (brew install xcbeautify)"; exit 1; }
          xcbeautify --version

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: GoInfoGame/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('GoInfoGame/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/GoInfoGame-*/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('GoInfoGame/GoInfoGame.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Write Secrets.xcconfig (only if missing)
        env:
          KARTAVIEW_ACCESS_TOKEN: ${{ secrets.KARTAVIEW_ACCESS_TOKEN }}
          JAWG_ACCESS_TOKEN: ${{ secrets.JAWG_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          dest="GoInfoGame/GoInfoGame/Resources/Secrets.xcconfig"
          if [ -f "$dest" ]; then
            echo "$dest already present on runner - leaving it untouched."
          elif [ -n "${KARTAVIEW_ACCESS_TOKEN:-}" ] || [ -n "${JAWG_ACCESS_TOKEN:-}" ]; then
            {
              echo "KARTAVIEW_ACCESS_TOKEN = ${KARTAVIEW_ACCESS_TOKEN:-}"
              echo "JAWG_ACCESS_TOKEN = ${JAWG_ACCESS_TOKEN:-}"
            } > "$dest"
            echo "Wrote $dest from repository secrets."
          else
            echo "No $dest and no token secrets - Config.xcconfig #include? tolerates this."
          fi

      - name: pod install
        working-directory: GoInfoGame
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: pod install

      - name: Pick & boot simulator
        run: |
          set -euo pipefail
          xcrun simctl shutdown all || true
          UDID=$(xcrun simctl list devices available | grep -m1 "$SIMULATOR (" | grep -oE '[0-9A-F-]{36}' || true)
          if [ -z "$UDID" ]; then
            echo "::error::Simulator '$SIMULATOR' not available on this runner. iPhones present:"
            xcrun simctl list devices available | grep -i iphone || true
            exit 1
          fi
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -workspace "$WORKSPACE" -scheme "$SCHEME"

      - name: Run tests
        run: |
          set -o pipefail
          mkdir -p build/reports
          NSUnbufferedIO=YES xcodebuild test \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=${SIM_UDID}" \
            -resultBundlePath "build/TestResults.xcresult" \
            -enableCodeCoverage YES \
            -retry-tests-on-failure \
            -test-timeouts-enabled YES \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild.log \
            | xcbeautify --report junit --report-path build/reports

      - name: Publish test report (checks/PR annotations)
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: build/reports/junit.xml
          check_name: iOS test results
          include_passed: true
          require_tests: true

      - name: Ensure a PDF engine (weasyprint)
        if: always()
        continue-on-error: true   # PDF is optional; MD/HTML are produced regardless
        run: command -v weasyprint >/dev/null || brew install --quiet weasyprint

      - name: Generate test report (MD / HTML / PDF)
        if: always()
        continue-on-error: true
        env:
          GIT_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 scripts/ci/test_report.py \
            --junit build/reports/junit.xml \
            --xcresult build/TestResults.xcresult \
            --out-dir build/report

      - name: Upload results + reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            build/report/test-report.md
            build/report/test-report.html
            build/report/test-report.pdf
            build/TestResults.xcresult
            build/reports/junit.xml
            build/xcodebuild.log
          retention-days: 14
          if-no-files-found: warn

      - name: Clean up simulators
        if: always()
        run: xcrun simctl shutdown all || true
